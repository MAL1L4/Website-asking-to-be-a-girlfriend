<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอตังค์ตังค์เป็นแฟน💖</title>
    <!-- นำเข้าฟอนต์น่ารักๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* สีพื้นหลังสีชมพูอ่อน */
            background-color: #fdecf4; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
            position: relative;
        }

        /* ตกแต่งข้อความภาษาไทยด้านบน */
        .title {
            font-family: 'Mali', cursive;
            font-size: 26px;
            color: #ffffff;
            -webkit-text-stroke: 1.5px #666;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            line-height: 1.4;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }

        /* แถวหัวใจ */
        .hearts-row {
            color: #ff0000;
            font-size: 20px;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        /* ตกแต่งรูปซองจดหมาย */
        .envelope-img {
            width: 100%;
            max-width: 320px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            
            /* ทำให้เมาส์เปลี่ยนเป็นรูปมือเวลานำไปชี้ */
            cursor: pointer; 
            /* เพื่อให้มันค่อยๆ ขยายเวลานำเมาส์ไปชี้ */
            transition: transform 0.2s;
        }

        /* ทำให้รูปขยายขึ้นนิดนึงเวลาเมาส์ชี้ */
        .envelope-img:hover {
            transform: scale(1.05);
        }

        /* ตกแต่งข้อความภาษาอังกฤษ */
        .message-text {
            color: #ff4081;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* ตกแต่งปุ่มกด */
        .open-btn {
            background-color: #ffc0cb;
            color: #e91e63;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 900;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            box-shadow: 0 4px 0px #fbaec0;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* เอฟเฟกต์เวลากดปุ่ม */
        .open-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #fbaec0;
        }

        .btn-icon {
            font-size: 20px;
        }

        /* หัวใจลอยๆ พื้นหลัง */
        .floating-heart {
            position: absolute;
            color: #ffb6c1;
            font-size: 24px;
            opacity: 0.7;
            z-index: 1;
        }
        .fh-1 { top: -20px; right: 20px; font-size: 40px; }
        .fh-2 { top: 40px; left: 10px; font-size: 30px; opacity: 0.5; }
        .fh-3 { bottom: 50px; left: 20px; font-size: 20px; }
        
    </style>
</head>
<body>

    <div class="container">
        <!-- หัวใจลอยตกแต่งพื้นหลัง -->
        <div class="floating-heart fh-1">🩷</div>
        <div class="floating-heart fh-2">🩷</div>
        <div class="floating-heart fh-3">🩷</div>

        <h1 class="title">
            ก๊อก ก๊อก<br>มีจดหมายมาส่งคั้บ 
        </h1>

        <div class="hearts-row">
            ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ 
        </div>

        <!-- รูปซองจดหมาย (มีลูกเล่นคลิกแล้วไป page2) -->
        <img src="pic1.png" alt="Pink Envelope" class="envelope-img" onclick="alert('แอบเปิดจดหมายเหรอ! ไปดูข้างในกัน 💌'); window.location.href='page2.html';">

        <!-- ข้อความ -->
        <div class="message-text">
            <p>KNOCK KNOCK!</p>
            <p>YOU'VE GOT A LETTER JUST FOR YOU</p>
        </div>

        <!-- ปุ่มกด (มีลูกเล่นคลิกแล้วไป page2) -->
        <button class="open-btn" onclick="alert('เย้ เย้ ไปกันต่อ! 💖'); window.location.href='page2.html';">
            <span class="btn-icon">💌</span> Click to open it
        </button>
    </div>

</body>
</html>
