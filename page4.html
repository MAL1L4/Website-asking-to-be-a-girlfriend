<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เย้! เป็นแฟนกันแล้วนะ 💖</title>
    <!-- นำเข้าฟอนต์ลายมือน่ารักๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fdecf4; 
            background-image: radial-gradient(#ffc4d9 1px, transparent 1px);
            background-size: 20px 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Mali', cursive;
            padding: 20px;
        }

        .polaroid-card {
            background-color: white;
            padding: 15px 15px 30px 15px; 
            box-shadow: 0 15px 35px rgba(233, 30, 99, 0.2);
            transform: rotate(-3deg); 
            transition: transform 0.3s;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .polaroid-card:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .photo-frame {
            width: 100%;
            aspect-ratio: 1 / 1; 
            background-color: #f5f5f5;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ccc;
            font-size: 14px;
        }

        .my-cute-pic {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        .caption {
            font-size: 24px;
            font-weight: 700;
            color: #d81b60; 
            line-height: 1.5;
        }

        .sub-caption {
            font-size: 16px;
            color: #888;
            margin-top: 10px;
        }
        
        .floating-heart {
            position: absolute;
            font-size: 30px;
            animation: float 3s ease-in-out infinite;
        }

        .fh-1 { top: -20px; right: -10px; animation-delay: 0s; }
        .fh-2 { bottom: 20px; left: -20px; font-size: 40px; animation-delay: 1s; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

    </style>
</head>
<body>

    <div class="polaroid-card">
        <div class="floating-heart fh-1">💖</div>
        <div class="floating-heart fh-2">💕</div>

        <div class="photo-frame">
            <!-- 💡 อย่าลืมเปลี่ยนชื่อไฟล์รูปตรงนี้นะครับ -->
            <img src="txngtxngpic.jpg" class="my-cute-pic" alt="Cute Picture">
        </div>

        <div class="caption">
            ฝากตัวและหัวใจด้วยนะคั้บ!<br>คุณแฟน 🥰
        </div>
        
        <!-- 💡 เพิ่ม id="currentDate" เพื่อให้ JavaScript หาตำแหน่งเจอ -->
        <div id="currentDate" class="sub-caption">
            <!-- วันที่จะถูกสร้างขึ้นมาอัตโนมัติที่นี่ -->
        </div>
    </div>

    <!-- 💡 เพิ่ม JavaScript สำหรับดึงวันที่ปัจจุบัน -->
    <script>
        // สร้างตัวแปรดึงวันที่ปัจจุบัน
        const today = new Date();
        
        // กำหนดรูปแบบวันที่ให้เป็นภาษาอังกฤษแบบย่อ (เช่น 14 Feb 2026)
        // ถ้าอยากให้เป็นภาษาไทย สามารถเปลี่ยน 'en-GB' เป็น 'th-TH' ได้ครับ
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        const formattedDate = today.toLocaleDateString('en-GB', options);
        
        // เอาวันที่ที่จัดรูปแบบแล้ว ไปแสดงในหน้าเว็บ พร้อมเติมหัวใจต่อท้าย
        document.getElementById('currentDate').innerHTML = formattedDate + ' 🩷';
    </script>

</body>
</html>
