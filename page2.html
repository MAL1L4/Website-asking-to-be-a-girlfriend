<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัตรคนโสด</title>
    <!-- นำเข้าฟอนต์ลายมือน่ารักๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
    
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: repeating-linear-gradient(
            0deg,
            #ffdbea,
            #ffdbea 60px,
            #ffc4d9 60px,
            #ffc4d9 80px
        );
        font-family: 'Mali', cursive;
        color: #4a4a4a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 15px; /* ลด padding ลงนิดหน่อยสำหรับมือถือ */
    }

    .container {
        max-width: 550px;
        width: 100%;
    }

    .card {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 25px; /* ปรับลดลงให้ดูไม่อึดอัดบนจอเล็ก */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        position: relative;
    }

    h1 {
        text-align: center;
        font-size: clamp(24px, 5vw, 32px); /* ฟอนต์ยืดหยุ่นตามขนาดจอ */
        font-weight: 600;
        margin-bottom: 20px;
    }

    /* --- จุดสำคัญ: ปรับการวาง Layout --- */
    .top-section {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap; /* ให้รูปกับข้อมูลตัดขึ้นบรรทัดใหม่ได้ถ้าที่พอ */
        justify-content: center;
    }

    .photo-box {
        width: 140px;
        height: 170px;
        border-radius: 15px;
        flex-shrink: 0;
        object-fit: cover;
        background-color: #fcfcfc;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .info-section {
        flex-grow: 1;
        min-width: 250px; /* บังคับให้ถ้าจอกว้างน้อยกว่านี้จะตัดลงข้างล่าง */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .form-group {
        display: flex;
        align-items: flex-end;
        margin-bottom: 12px;
        gap: 5px;
        font-size: 16px; /* ลดขนาดลงนิดนึงเพื่อความเซฟ */
        white-space: nowrap; /* กันข้อความกระโดด */
    }

    input[type="text"] {
        border: none;
        border-bottom: 1.5px solid #4a4a4a;
        background: transparent;
        font-family: 'Mali', cursive;
        font-size: 16px;
        color: #d81b60;
        outline: none;
        padding: 0 5px;
        min-width: 20px; /* ป้องกัน input หาย */
    }

    .w-small { width: 45px; }
    .w-med { width: 100px; }
    .w-large { flex-grow: 1; width: 50%; } /* ใช้ width เป็น % เพื่อให้ยืดหยุ่น */

    .radio-group {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 15px;
        flex-wrap: wrap; /* ป้องกัน radio button ล้นจอ */
        white-space: normal; /* ยอมให้ radio ขึ้นบรรทัดใหม่ได้ */
    }

    .radio-label {
        display: flex;
        align-items: center;
        pointer-events: none; 
    }

    .bottom-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 16px;
    }

    /* --- ปุ่มกดที่ Responsive --- */
    .button-group {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    .open-btn {
        background-color: #ffc0cb;
        color: #e91e63;
        border: none;
        padding: 10px 15px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 0px #fbaec0;
        transition: all 0.1s;
        flex: 1; /* ให้ปุ่มขยายเท่ากัน */
        min-width: 160px; /* แต่ไม่ให้แคบเกินไป */
    }

    .open-btn:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0px #fbaec0;
    }

    /* --- สำหรับหน้าจอมือถือขนาดเล็กมาก --- */
    @media (max-width: 400px) {
        .card {
            padding: 15px;
        }
        .form-group {
            flex-wrap: wrap; /* ถ้าชื่อยาวเกินไป ให้ชื่อลงมาข้างล่าง */
        }
        .info-section {
            min-width: 100%;
        }
    }
</style>
</head>
<body>

    <div class="container">
        
        <!-- ตัวการ์ด -->
        <div class="card">
            <h1>บัตรแนะนำตัว 🩷</h1>

            <div class="top-section">
                <!-- 💡 แก้ไขโค้ดรูปภาพให้ถูกต้อง (ลบเครื่องหมาย > ที่เกินมา และลบ div ที่ครอบอยู่ออก) -->
                <img src="my_profile.jpg" class="photo-box" style="object-fit: cover;" alt="My Profile">

                <div class="info-section">
                    <div class="form-group">
                        ชื่อ: <input type="text" class="w-med" value="อามิน" readonly>
                        อายุ: <input type="text" class="w-small" value="20" readonly>
                    </div>
                    
                    <div class="form-group">
                        เพศ: <input type="text" class="w-small" value="ชาย" readonly>
                        อาชีพ: <input type="text" class="w-med" value="นักศึกษา" readonly>
                    </div>

                    <div class="form-group radio-group">
                        ชอบ 
                        <label class="radio-label"><input type="radio" name="age_pref"> รุ่นเดียวกัน</label>
                        <label class="radio-label"><input type="radio" name="age_pref"> โตกว่า</label>
                        <label class="radio-label"><input type="radio" name="age_pref"> เด็กกว่า</label>
                        <label class="radio-label"><input type="radio" name="age_pref" checked> ตังค์ตังค์</label>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        มหาวิทยาลัย: <input type="text" class="w-large" value="KMUTNB" readonly>
                    </div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="form-group">
                    ความสามารถพิเศษ: <input type="text" class="w-large" value="เขียนเว็บได้นิดหน่อย" readonly>
                </div>
                <div class="form-group">
                    สเปคด้านนิสัย: <input type="text" class="w-large" value="ไม่ติดสปอย ติดแฟน รักแฟนมากด้วย" readonly>
                </div>
            </div>
        
            <!-- 💡 เพิ่มกล่องครอบปุ่ม เพื่อจัดให้อยู่กึ่งกลาง -->
            <div class="button-group">
                <button class="open-btn" onclick="alert('อ้าว ไม่อ่านต่อหรอ 🥺'); window.location.href='index.html';">
                    <span class="btn-icon">💌</span> ปิดจดหมาย ;-;
                </button>
                <button class="open-btn" onclick="alert('หน้าต่อไปจะมีอะไรนะ ? '); window.location.href='page3.html';">
                    <span class="btn-icon">💌</span> เปิดข้อความต่อไป  
                </button>
            </div>
            
        </div>
    </div>

</body>
</html>
