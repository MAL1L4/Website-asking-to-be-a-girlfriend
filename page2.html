<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัตรคนโสด</title>
    <!-- นำเข้าฟอนต์ลายมือน่ารักๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* พื้นหลังสีชมพูลายขวางแบบในรูป */
            background: repeating-linear-gradient(
                0deg,
                #ffdbea,
                #ffdbea 60px,
                #ffc4d9 60px,
                #ffc4d9 80px
            );
            font-family: 'Mali', cursive; /* ใช้ฟอนต์ลายมือ */
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
        }

        /* ส่วนหัวข้อด้านบน */
        .header {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header img {
            height: 50px; /* ขนาดรูปการ์ตูนตรงหัวข้อ */
        }

        .ig-input {
            width: 150px;
            border: none;
            border-bottom: 2px solid #4a4a4a;
            background: transparent;
            font-family: 'Mali', cursive;
            font-size: 20px;
            color: #4a4a4a;
            outline: none;
            text-align: center;
            /* ทำให้เมาส์เป็นรูปปกติ ไม่ใช่รูปตัว I (I-beam) เวลาชี้ที่ข้อความที่ล็อกแล้ว */
            cursor: default; 
        }

        /* กล่องการ์ดสีขาว */
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* ส่วนด้านบนที่มีรูปและข้อมูลส่วนตัว */
        .top-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .photo-box {
            width: 130px;
            height: 160px;
            border: none; /* เอากรอบออก */
            border-radius: 10px; /* เพิ่มความโค้งมนให้รูป */
            flex-shrink: 0;
            background-color: #fcfcfc;
        }

        .info-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .form-group {
            display: flex;
            align-items: flex-end;
            margin-bottom: 12px;
            gap: 5px;
            font-size: 18px;
        }

        /* ช่องกรอกข้อมูล */
        input[type="text"] {
            border: none;
            border-bottom: 1.5px solid #4a4a4a;
            background: transparent;
            font-family: 'Mali', cursive;
            font-size: 18px;
            color: #d81b60; /* สีตัวหนังสือตอนพิมพ์เป็นสีชมพูเข้ม */
            outline: none;
            padding: 0 5px;
            cursor: default; /* ทำให้เมาส์เป็นรูปปกติ */
        }

        .w-small { width: 60px; }
        .w-med { width: 120px; }
        .w-large { flex-grow: 1; }

        /* ตัวเลือกวิทยุ (Radio buttons) */
        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 18px;
            flex-wrap: wrap;
        }

        .radio-label {
            display: flex;
            align-items: center;
            /* ป้องกันการคลิก */
            pointer-events: none; 
        }

        .radio-label input {
            margin-right: 5px;
            accent-color: #ff8fb3; /* สีปุ่มกด */
        }

        /* ส่วนด้านล่าง */
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 18px;
        }

        .indent {
            padding-left: 30px; /* ย่อหน้าให้ตรงกับรูป */
        }

        /* เครดิตด้านล่าง */
        .footer-credit {
            text-align: center;
            color: #ffffff;
            margin-top: 15px;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* ปุ่มกด */
        .open-btn {
            background-color: #ffc0cb; /* สีพื้นหลังปุ่มชมพู */
            color: #e91e63; /* สีตัวอักษรชมพูเข้ม */
            border: none;
            padding: 12px 20px; /* ปรับขนาดปุ่มให้กะทัดรัดขึ้นนิดนึงเวลาอยู่คู่กัน */
            border-radius: 50px; /* ทำให้ปุ่มโค้งมน */
            font-size: 14px;
            font-weight: 900;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0px #fbaec0; /* เงาปุ่มให้ดูมีมิติ */
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* เอฟเฟกต์เวลากดปุ่ม */
        .open-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #fbaec0;
        }
        
        .btn-icon {
            font-size: 18px;
        }

        /* 💡 เพิ่มคลาสใหม่สำหรับจัดกลุ่มปุ่มให้อยู่ตรงกลาง */
        .button-group {
            display: flex;
            justify-content: center; /* จัดให้อยู่กึ่งกลางแนวนอน */
            gap: 15px; /* ระยะห่างระหว่าง 2 ปุ่ม */
            margin-top: 25px; /* ระยะห่างจากด้านบน ให้ห่างจากข้อความหน่อย */
            flex-wrap: wrap; /* เผื่อหน้าจอเล็กจะได้ปัดลงมาสวยๆ */
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- ตัวการ์ด -->
        <div class="card">
            <h1>บัตรแนะนำตัว 🩷</h1>

            <div class="top-section">
                <!-- 💡 แก้ไขโค้ดรูปภาพให้ถูกต้อง (ลบเครื่องหมาย > ที่เกินมา และลบ div ที่ครอบอยู่ออก) -->
                <img src="my_profile.jpg" class="photo-box" style="object-fit: cover;" alt="My Profile">

                <div class="info-section">
                    <div class="form-group">
                        ชื่อ: <input type="text" class="w-med" value="อามิน" readonly>
                        อายุ: <input type="text" class="w-small" value="20" readonly>
                    </div>
                    
                    <div class="form-group">
                        เพศ: <input type="text" class="w-small" value="ชาย" readonly>
                        อาชีพ: <input type="text" class="w-med" value="นักศึกษา" readonly>
                    </div>

                    <div class="form-group radio-group">
                        ชอบ 
                        <label class="radio-label"><input type="radio" name="age_pref"> รุ่นเดียวกัน</label>
                        <label class="radio-label"><input type="radio" name="age_pref"> โตกว่า</label>
                        <label class="radio-label"><input type="radio" name="age_pref"> เด็กกว่า</label>
                        <label class="radio-label"><input type="radio" name="age_pref" checked> ตังค์ตังค์</label>
                    </div>

                    <div class="form-group" style="margin-top: 10px;">
                        มหาวิทยาลัย: <input type="text" class="w-large" value="KMUTNB" readonly>
                    </div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="form-group">
                    ความสามารถพิเศษ: <input type="text" class="w-large" value="เขียนเว็บได้นิดหน่อย" readonly>
                </div>
                <div class="form-group">
                    สเปคด้านนิสัย: <input type="text" class="w-large" value="ไม่ติดสปอย ติดแฟน รักแฟนมากด้วย" readonly>
                </div>
            </div>
        
            <!-- 💡 เพิ่มกล่องครอบปุ่ม เพื่อจัดให้อยู่กึ่งกลาง -->
            <div class="button-group">
                <button class="open-btn" onclick="alert('อ้าว ไม่อ่านต่อหรอ 🥺'); window.location.href='index.html';">
                    <span class="btn-icon">💌</span> ปิดจดหมาย ;-;
                </button>
                <button class="open-btn" onclick="alert('หน้าต่อไปจะมีอะไรนะ ? '); window.location.href='page3.html';">
                    <span class="btn-icon">💌</span> เปิดข้อความต่อไป  
                </button>
            </div>
            
        </div>
    </div>

</body>
</html>
